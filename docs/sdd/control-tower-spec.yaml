        - Every classification records a full rule trace inspectable by a human.
    privacy_risks:
      - { id: PR-01, description: 'Public production surface with auth disabled exposes customer names and emails', severity: critical, blocker: BLK-01 }
      - { id: PR-02, description: 'No retention or deletion schedule for imported personal data',                    severity: critical, blocker: BLK-10 }
      - { id: PR-03, description: 'No automated check that personal data does not reach logs',                       severity: critical, blocker: BLK-09 }
      - { id: PR-04, description: 'Data residency of hosting platform not assessed',                                 severity: critical, blocker: BLK-13 }
      - { id: PR-05, description: 'Uploaded source files may be retained on disk after import',                      severity: material }
    required_controls:
      - enforce_entra_id_authentication_in_production
      - authenticated_principal_recorded_in_audit_trail
      - retention_schedule_and_deletion_job
      - pii_in_logs_scan_in_ci
