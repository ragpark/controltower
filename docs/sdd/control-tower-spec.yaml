      rationale: 18 open certification blockers (16 inherited + 2 critical + 2 material added by reconciliation); BLK-01 live in production.

  devops_and_operations:
    service_owner: null
    support_model:
      status: '🔴 not defined'
    environments:
      - { name: local,       status: available }
      - { name: ci,          status: available }
      - { name: staging,     status: '🔴 does not exist', blocker: BLK-14 }
      - { name: production,  platform: railway, status: live_unauthenticated }
    ci_cd_pipeline:
      does_not_do:
        - build container images
        - boot-test the images
        - enforce a coverage floor outside one package
        - scan for PII in logs
        - scan dependencies or secrets
