            The definitions survive only in the delivery pack Markdown and in
            git history (commit c880653). Generating the pack from the YAML
            before restoring them would destroy the surviving copy.
          acceptance_criteria:
            - Given the traceability matrix references FR-01…FR-19, TC-01…TC-18, ADR-01…ADR-15, UX-J01…UX-J05 and C-01…C-08, when the record is loaded, then every referenced id resolves to a definition in the YAML.
            - Given a reader has only the YAML, when they read it, then no section defers to the Markdown pack for detail.
            - Given restoration is from OCT-001 content, when each definition lands, then its inherited_from attribution is preserved.
        - id: ENG-901
          title: Delivery pack generator
          status: unblocked_not_started   # ENG-900 delivered
          implements: ADR-16
          acceptance_criteria:
            - Given a valid spec YAML, when the generator runs, then it writes docs/sdd/control-tower-delivery-pack.md and exits 0.
            - Given the pack is regenerated with no YAML change, when the output is compared to the committed pack, then there is no diff — generation is deterministic.
            - Given the pack has been hand-edited, when CI runs, then the job fails and names the hand-edited file.
            - Given the spec is not certified, when the pack is generated, then it carries the DRAFT / HUMAN REVIEW REQUIRED / NOT CERTIFIED banner per Implementation Guide section 17.
        - id: ENG-902
          title: Spec validation CI job
          status: not_started
          implements: ADR-17
          human_sign_off_required: true
          sign_off_reason: ci_cd_and_deployment_configuration_changes
          closes: [BLK-17]
          acceptance_criteria:
            - Given the spec YAML, when the job runs, then it fails if the file does not parse or if any of the 21 schema v2.0.0 sections is absent.
            - Given a duplicate id anywhere in the record, when the job runs, then it fails and names the duplicate.
            - Given a duplicate mapping KEY anywhere in the record, when the job runs, then it fails and names both line numbers. A standard YAML loader keeps only the last occurrence, so a duplicate key silently deletes content — this exact defect reached PR #12 and was caught by review rather than by a check.
            - Given a traceability reference with no matching definition, when the job runs, then it fails and names the dangling reference.
            - Given a derived count that disagrees with the list it summarises, when the job runs, then it fails and prints both numbers — this check must fail today against open_blocker_summary until SD-01 lands.
            - Given an FR with no linked test case, when the job runs, then it reports the orphan.
            - Given the job fails, when a merge is attempted, then the merge is blocked.
        - id: ENG-903
          title: Pull request template
          status: not_started
          implements: ADR-17
          acceptance_criteria:
            - Given a new pull request, when the author opens it, then the body is prefilled with Spec ID, ADR, Task ID and the required_for_ai_coding_tools checklist.
            - Given a UI change, when the template is used, then it asks for the accessibility check explicitly.
