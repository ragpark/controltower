      - { id: BI-02, invariant: 'Dockerfile `test -f` entrypoint guards retained' }
      - { id: BI-03, invariant: 'Web Dockerfile copies and builds every workspace package imported' }

  qa_and_verification:
    total_unit_and_component_tests_passing: 204
    breakdown:
      ui-components: 8
      classification: 42
      ingestion: 87
      reporting: 18
      api: 49
    test_cases_inherited_from_oct_001: 18
    coverage_requirements:
      target_new_code: 0.80
      enforced_in: [services/classification]
      gap_task: ENG-705
    acceptance_recommendation:
