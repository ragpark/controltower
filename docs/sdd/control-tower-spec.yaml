            - Given a request that collides with a guardrail, when the skill runs, then it names the guardrail and stops rather than drafting.
            - Given a request that touches the human sign-off list, when the skill drafts, then the required sign-off is stated in the draft.
            - Given a drafted delta, when the skill finishes, then it opens PR 1 containing no code.
        - id: ENG-905
          title: Branch protection on main
          status: not_started
          implements: ADR-17
          owner_action_required: true
          rationale: >-
