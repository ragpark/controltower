      - { pr: 3, summary: Detect CSV delimiter }
      - { pr: 4, summary: Ingest daily failure report and route ownership }
      - { pr: 5, summary: Source-aware upload picker }
      - { pr: 6, summary: Stacked-bar trend with drill-through }
