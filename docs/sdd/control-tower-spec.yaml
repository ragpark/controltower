      - link_prs_to_relevant_adrs
      - link_prs_to_task_id
      - include_unit_tests
      - include_contract_tests_when_api_or_event_surface_changed
      - include_accessibility_checks_for_ui_changes
      - pass_pii_in_logs_review
      - include_audit_write_for_state_changing_operator_actions
      - use_correlation_ids
      - use_structured_json_logging
      - keep_domain_logic_in_dependency_free_service_packages
      - ship_a_regression_test_with_every_defect_fix
      - state_whether_container_images_were_built
      - human_reviewer_approval
