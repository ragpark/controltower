        be run while BLK-11 is open — backup and restore are neither documented
        nor tested, and there are no down migrations.
      guardrail: eng_1104_precondition_blk_11_closed
      rationale: >-
        Directed by the accountable owner. The risk is materially reduced but
        not eliminated: history and rule trace are re-pointed to the survivor
        and the removed row is snapshotted into the survivor's history before
        deletion, so the order line's past survives without needing a database
        restore. The row itself is still permanently deleted.
