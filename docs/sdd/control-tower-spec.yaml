    - { id: BLK-08, description: coverage floor not enforced, severity: material }
    - { id: BLK-09, description: no PII-in-logs scan, severity: critical }
    - { id: BLK-10, description: no retention schedule, severity: critical }
    - { id: BLK-11, description: backup and restore untested, no down migrations, severity: critical }
