    # -----------------------------------------------------------------------
    # Added by SD-03. Defects are recorded here with their root cause and the
    # regression test that must fail before the fix.
    # -----------------------------------------------------------------------
    defects:
      - id: DEF-01
        title: Cross-import deduplication is case-sensitive while in-batch deduplication is not
        raised_by: SD-03
        severity: S2
        severity_rationale: >-
          Orders silently duplicated. Classification, queue counts, trend
          buckets and every dashboard total are inflated by the duplicate rows.
        status: open
        reported_symptom: duplicates observed in the database by the accountable owner
        root_cause: >-
          services/ingestion/src/dedup.ts dedupKey() collapses in-file
          duplicates on `orderNumber.trim().toLowerCase()` plus
          `productCode.trim().toLowerCase()`. The cross-import lookup in
          apps/api/src/imports/orchestrator.service.ts upsertOrder() queries
          the orderNumber_productCode unique index with the raw values, and
          Postgres text equality is exact. The two disagree on what "the same
          order line" means.
        consequence: >-
          The same logical order line arriving in two imports with different
          letter case is inserted twice. The database unique constraint does
          not prevent it, because the strings genuinely differ. Whitespace is
          not affected — pick() already trims on parse.
        confidence: >-
          Mechanism confirmed by reading the code. NOT confirmed against the
          production database — no query has been run. FR-21 exists to
          establish whether this is the cause of the reported duplicates, or
          only one of them.
        alternative_causes_to_rule_out_via_FR-21:
          - multi-line orders read as duplicates — one order number, several product codes, which is correct data and not duplication
          - product codes differing by punctuation, for example a hyphenated ISBN against an unhyphenated one
          - order numbers carrying a source-specific prefix in one feed and not another
        guardrail_engaged: deduplication_key_changes
        guardrail_note: >-
          The natural key is NOT being changed — it remains
          (order_number, product_code) per ADR-04. What changes is how the two
          sides are compared. That still meets the sign-off threshold and must
          not be treated as a routine fix.
        regression_test_required: true
        tasks: [ENG-1101, ENG-1104]
      - id: DEF-02
        title: Failure-to-order join is case-sensitive
        raised_by: automated review of PR #14
        severity: S2
        status: fixed_in_pr_14
        root_cause: >-
          FailuresService.syncOrderSummaries keyed its `desired` map on the raw
          failure order number and looked orders up with exact equality. Where
          the same order number is stored in different cases (DEF-01), the join
          matched nothing.
        consequence: >-
          Worse than a missing link. The full-resync branch selects any order
          carrying a provisioning summary, finds no case-matching failure, and
          CLEARS the summary — then reclassification moves the order out of
          Customer Impacted. A customer-impacting order silently stops looking
          customer-impacting.
        surfaced_by: >-
          ENG-1104. Removing the row a failure matched exactly leaves a survivor
          spelled differently, which is precisely the trigger.
        fix: >-
          Normalise both sides of the join. Order lookups use case-insensitive
          matching; unmatched numbers are still reported as the failure spells
          them.
        regression_tests: [failures.service.spec — three DEF-02 cases]

