    # -----------------------------------------------------------------------
    # Added by SD-01 — how change is requested and how it lands in the record.
    # -----------------------------------------------------------------------
    change_intake:
      model: two_pull_requests
      pr_1_spec_delta:
        contains: [new_or_changed_fr, adr_where_precedent_is_set, eng_tasks, acceptance_criteria_given_when_then, traceability_links]
        contains_no_code: true
        merged_when: accountable_owner_has_ratified_the_what
      pr_2_implementation:
        contains: [code, tests, contribution_log_entry, status_and_blocker_updates, completed_traceability_links]
        merged_when: tests_green_and_record_updated
      request_template:
        - outcome — what should be true that is not true today
        - for_whom — persona id, or a new persona
        - why_now — the trigger; what breaks or costs if deferred
        - done_when — how the requester would verify it themselves
        - constraint — deadline, must-not-touch, must-reuse
      triage:
        - { request: new_capability,                     path: new FR plus ADR where precedent is set, spec_delta_required: true }
        - { request: change_to_existing_behaviour,       path: amend the FR and its acceptance criteria, spec_delta_required: true }
        - { request: defect_code_does_not_match_spec,    path: ENG task plus failing regression test,    spec_delta_required: false }
        - { request: defect_spec_itself_was_wrong,       path: amend the FR then fix,                    spec_delta_required: true }
        - { request: governance_decision,                path: record-only change,                       spec_delta_required: false, decided_by: accountable_owner_only }
        - { request: touches_human_sign_off_list,        path: sign-off recorded before work starts,     spec_delta_required: true }
      emergency_path:
        rationale: >-
          A process with no emergency route is abandoned at the first
          emergency. Live production risk is fixed first and recorded after.
        applies_to: live_production_risk_only
        procedure:
          - fix the risk
          - record an exceptions_and_waivers entry naming what was skipped and why, same working day
          - add a contribution_log entry
        currently_applicable_to: [BLK-01]

    # -----------------------------------------------------------------------
    # SD-03 task detail — duplicate integrity and Top Products scoping.
    # Sequencing is deliberate: diagnose, then stop the bleeding, then and only
    # then consider touching existing rows.
    # -----------------------------------------------------------------------
    duplicate_integrity:
      requirements: [FR-21, FR-22]
      defect: DEF-01
      tasks:
        - id: ENG-1102
          title: Duplicate diagnostics, read only
          requirement: FR-21
          status: delivered_awaiting_owner_confirmation
          delivered_at: '2026-08-14'
          delivered_as: 'GET /api/v1/duplicates and the Operations > Duplicate Orders page'
          sequence: 1
          rationale: >-
            Runs first. Establishes what is actually duplicated before any
            code changes behaviour or touches a row.
          acceptance_criteria:
            - Given the endpoint, when it is called, then it returns groups keyed on the case-insensitive natural key with every stored variant and its provenance.
            - Given the implementation, when it is reviewed, then it issues read queries only.
            - Given the UI, when it renders in Operations, then it is reachable from the Operations navigation and states plainly that it changes nothing.
        - id: ENG-1101
          title: Make cross-import deduplication agree with in-batch deduplication
          defect: DEF-01
          sequence: 2
          human_sign_off_required: true
          sign_off_reason: deduplication_key_changes
          rationale: >-
            Stops new duplicates. Does not repair existing ones — that is
            ENG-1104, deliberately separated.
          acceptance_criteria:
            - Given TC-27, when it is run before the fix, then it fails; when run after, then it passes.
            - Given the natural key, when the fix lands, then it is still (order_number, product_code) — ADR-04 is unchanged in substance.
            - Given the comparison, when it is implemented, then one shared helper defines key equality for both the in-batch path and the cross-import lookup, so the two cannot drift apart again.
            - Given a case-insensitive lookup, when it runs at import scale, then it uses an index rather than a sequential scan.
            - Given genuine multi-line orders, when they are imported, then they are unaffected.
        - id: ENG-1103
          title: Top Products counts completed only
          requirement: FR-22
          sequence: independent
          note: Independent of the duplicate work; can be built and merged on its own.
          acceptance_criteria:
            - Given the dashboard, when Top Products renders, then it counts COMPLETED orders only and its label states so.
            - Given the by-product endpoint called without the new filter, when it responds, then behaviour is unchanged — contract test TC-33.
        - id: ENG-1104
          title: Merge or reconcile existing duplicate rows
          sequence: 3
          status: delivered_awaiting_owner_confirmation
          delivered_at: '2026-08-14'
          delivered_as: 'POST /api/v1/duplicates/resolve, operator role, per-group confirmation'
          previous_status: gated_not_authorised
          authorised_by:
            who: accountable_owner
            how: direct instruction in session on 2026-08-14
            wording: >-
              "Add the operation as a feature to remove orders which share the
              same Order and ISBN, but differ by import date. When deciding
              which to remove, use the import date and retain the most recent."
            sign_off_recorded: false
            sign_off_still_required: [deduplication_key_changes, database_migrations_affecting_customer_data]
            note: >-
              The owner directed the build. That is the decision to proceed; it
              is not the same artefact as a recorded sign-off, and this entry
              does not claim to be one.
          precondition_not_met:
            precondition: BLK-11 closed — backup and restore documented and tested
            status: still_open
            exception: EXC-06
            mitigation: >-
              The implementation does not rely on a database restore to be
              recoverable. Before a superseded row is deleted, its order_history
              and rule_executions are re-pointed to the survivor and the row
              itself is snapshotted into the survivor's history. The order
              line's past therefore survives inside the application's own data
              model. The row is still gone and cannot be restored from the UI.
          human_sign_off_required: true
          sign_off_reason: [database_migrations_affecting_customer_data, deduplication_key_changes]
          preconditions:
            - FR-21 diagnostics have run and the population is understood
            - BLK-11 closed — backup and restore documented and tested, because this is the first operation in the platform's history that destroys customer order rows
            - a reversal path exists, or the merge is soft, preserving the superseded row
          rationale: >-
            Deliberately gated. Merging order lines is irreversible, touches
            customer data, and would run today against a platform with no
            tested restore (BLK-11) and no authentication in production
            (BLK-01). The diagnostics view delivers most of the operational
            value at none of that risk.
          acceptance_criteria:
            - Given a duplicate group, when it is merged, then order_history retains every superseded variant and an audit record names the operator, the surviving row and each row merged into it.
            - Given a merge, when it completes, then provisioning failure links, rule executions and history rows previously attached to a merged row still resolve.
            - Given a merge, when it is requested, then it is explicitly confirmed by an operator per group — no bulk automatic merge.
            # Added 2026-08-14 at the owner's direction; amends a ratified task.
            - Given a group of duplicate rows, when a survivor is chosen, then it is the row with the most recent import date.
            - Given two rows imported at the same instant, when a survivor is chosen, then the tie is broken deterministically, so a dry run predicts the real run.
            - Given a caller names a group, when the survivor is chosen, then the server recomputes it rather than accepting a caller-supplied id, so a stale report cannot nominate the wrong row for deletion.

