      - ci_cd_and_deployment_configuration_changes
      - hosting_platform_or_residency_affecting_changes
      - seeded_classification_rule_changes
      - introduction_of_any_ai_ml_component

  build_invariants:
    - id: BI-01
      invariant: 'apps/api/tsconfig.build.json keeps rootDir "src" and excludes prisma'
      why: >-
        Without it, a file outside src/ moves the emitted entrypoint to
        dist/src/main.js; npm run build succeeds and the container crash-loops.
    - id: BI-02
      invariant: Dockerfile `test -f` entrypoint guards are retained
      why: catches BI-01 class failures at image build time
    - id: BI-03
      invariant: the web Dockerfile copies and builds every workspace package the app imports
      why: >-
        npm creates a dangling symlink for a missing workspace and exits 0; the
        failure surfaces later as MODULE_NOT_FOUND during next build.

