          ADR-14 records that no AI or ML inference exists in the
          classification path; classification is deterministic and
          human-editable.
      required_before: [certified]
    privacy_notice_and_transparency:
      privacy_notice_required: unknown
      audience: [internal_operations_users]
      status: not_started
      required_before: [release_ready]
    cookie_banner_and_tracking:
      cookies_or_tracking_used: false
      one_trust_required: false
      status: assessed_no_tracking_present
    data_retention:
      retention_schedule_defined: false
      policy_reference: null
      data_categories:
        - { name: orders,                     retention: undefined }
        - { name: order_history,              retention: undefined }
        - { name: provisioning_failures,      retention: undefined }
        - { name: audit_logs,                 retention: undefined }
        - { name: import_runs_and_errors,     retention: undefined }
      open_questions: [OQ-03]
    cloud_residency_and_transfers:
      data_hosting_locations: [railway_region_unconfirmed]
      data_processing_locations: [railway_region_unconfirmed]
      cross_border_transfer_present: unknown
      transfer_safeguards_required: unknown
      open_questions:
        - Which Railway region hosts the Postgres instance and containers?
        - Does that satisfy Pearson residency requirements for this data?
    non_production_data_use:
      production_data_used_in_non_production: unknown
      approval_required: true
      open_questions:
        - Are real ActiveHub exports used in local development?
    profiling_and_automated_decision_making:
      profiling_present: false
      automated_decision_making_present: false
      significant_effect_possible: false
      meaningful_human_involvement_required: true
      safeguards:
