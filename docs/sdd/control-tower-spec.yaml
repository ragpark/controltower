      involves_special_category_data: false
      involves_criminal_offence_data: false
      involves_children_data: false
      involves_ai_or_machine_learning: false
      involves_generative_ai: false
      involves_automated_decision_making: false
      involves_profiling: false
      involves_cookies_or_tracking: false
      involves_cloud_or_cross_border_processing: unknown
      involves_non_production_data_use: unknown
      involves_third_party_processors: true
      involves_associate_device_or_email_risk: true
