    - { id: BLK-14, description: no staging environment, severity: material }
    - { id: BLK-15, description: no runbooks, alerts, SLOs or service owner, severity: critical }
    - { id: BLK-16, description: delivery preceded specification; ADRs unratified, severity: critical }

  guardrails:
    permitted_for_ai_coding_tools:
      - add_or_extend_rule_strategies_behind_the_existing_registry
      - add_or_extend_source_connectors_behind_the_existing_registry
      - write_unit_contract_and_e2e_tests
