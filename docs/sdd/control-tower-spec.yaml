        # entered into a system whose privacy review has not started (BLK-02).
        - internal_staff_work_email
      direct_identifiers:
        - orders.customer_name
        - orders.customer_email
        - team_owners.email   # SD-02
      indirect_identifiers:
        - orders.customer_id
        - orders.order_number
        - provisioning_failures.contract_number
      source_of_truth: ActiveHub order export (upstream)
      data_classification: internal_confidential
      data_minimisation_summary: >-
        Not assessed. Importer currently ingests columns present in the
        upstream export, including customer name and email. Whether email
        is necessary has not been reviewed.
      purpose_limitation_summary: >-
        Operational triage of order and provisioning exceptions only. No
        marketing, profiling, model training or commercial decisioning.
      # Added by SD-02
      sd_02_delta:
        change: >-
          FR-20 introduces a directory of internal staff work email addresses.
          These are a new personal data category and a new data subject
          relationship — Pearson staff as contactable owners rather than as
          platform users.
        lawful_basis_position: >-
          Likely legitimate interests for internal operational contact, but
          undetermined; the platform has no lawful basis determination at all
          (BLK-02, OQ-03).
        minimisation_position: >-
          A shared team mailbox address satisfies the stated outcome and avoids
          holding named individuals' addresses. Recommended over personal
          addresses; recorded as OQ-A2-06.
        retention_position: undetermined — feeds BLK-10
        risk_added:
          id: PR-06
          description: >-
            A directory of internal staff email addresses on a production
            surface that is currently public and unauthenticated.
          severity: critical
          depends_on: BLK-01
          control: FR-20 deployment_gate — must not reach production while BLK-01 is open
        sign_off_required: retention_or_pii_handling_changes
        sign_off_status: not_obtained
    children_data:
      present: false
      enhanced_review_required: false
    privacy_impact_assessment:
      pia_required: true
      pia_status: not_started
      pia_reference: null
      pia_owner: null
      required_before: [certified]
    data_protection_impact_assessment:
      dpia_triggered: unknown
      dpia_status: not_started
      triggered_by:
