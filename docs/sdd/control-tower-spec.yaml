    # See the delivery pack for the fully expanded FR list. Omitted here for
    # readability; treat the delivery pack Markdown as canonical for FR detail.
    inherited_from: OCT-001
    count: 19
    delivered_true: 17
    delivered_but_disabled: 1   # FR-17
    delivered_but_not_exercised: 1  # FR-19

  ux_and_accessibility:
    design_system: MUI v6 with MUI X DataGrid; local component library in packages/ui-components
    brand_alignment: >-
      Not assessed against Pearson brand or the Pearson Design System.
    pearson_design_system_followup_required: true
    journeys:
