        - ENG-702_map_entra_groups_to_roles
        - ENG-703_authenticated_principal_in_audit
        - ENG-704_build_container_images_in_ci
        - ENG-705_coverage_gate_across_workspaces
        - ENG-706_pii_in_logs_scan
