  product_intent:
    problem_statement: >-
      Order lifecycle visibility was maintained by hand in an Excel dashboard.
      It was rebuilt manually, held classification logic in spreadsheet formulas
      known to one person, offered no history or audit, and could not join
      downstream provisioning failures to the orders they affected — so
      customer-impacting failures were found late and ownership of the next step
      was decided ad hoc.
    opportunity_statement: >-
      A single control tower that ingests order data from wherever it lives,
      classifies every order line against rules operations can change themselves,
      and surfaces what needs human action with a named owning team.
    vision: >-
      Every order line has a current, explainable state, and every
      customer-impacting exception has an owner and a next step.
    business_context:
      replaces: manual_excel_dashboard
      operating_model: internal_operations_team
      upstream_systems:
        - ActiveHub (order export)
        - downstream provisioning system (daily failure report by email)
      write_back: none
    goals:
      - id: G-01
        goal: Retire the manual Excel dashboard
        measures: [SM-01]
      - id: G-02
        goal: Make every classification explainable and auditable
        measures: [SM-04, SM-08]
      - id: G-03
        goal: Let operations change classification rules without a release
        measures: [SM-03]
      - id: G-04
        goal: Ingest from any source the data actually lives in
        measures: [SM-05]
      - id: G-05
        goal: Route customer-impacting provisioning failures to an owning team
        measures: [SM-02]
      - id: G-06
        goal: Operate the platform safely and under access control
        measures: [SM-06, SM-07, SM-09]
    non_goals:
      - order_placement_amendment_or_cancellation
      - write_back_to_activehub_gps_licence_manager_or_any_upstream_system
      - customer_or_partner_facing_access
      - learner_facing_functionality
      - billing_entitlement_or_licence_issuance
      - automated_remediation_of_provisioning_failures
      - ai_or_ml_inference_in_the_classification_path
      - multi_tenant_isolation
      - real_time_streaming_ingestion
      - native_mobile_applications
      - replacing_the_downstream_failure_email_at_source
    success_measures:
      - id: SM-01
        measure: Excel dashboard retired
        target: 'yes'
        current: unconfirmed
      - id: SM-02
        measure: Time from provisioning failure report to owner identified
        target: <= 1 working day
        current: not_instrumented
      - id: SM-03
        measure: Share of orders auto-classified without human triage
        target: '>= 0.90'
        current: not_instrumented
      - id: SM-04
        measure: Share of orders landing on the priority-1000 catch-all rule
        target: <= 0.05
        current: not_instrumented
      - id: SM-05
        measure: Import success rate (rows accepted / rows submitted)
        target: '>= 0.99'
        current: visible_per_run_not_aggregated
      - id: SM-06
        measure: Automated test coverage of new code
        target: '>= 0.80'
        current: enforced_in_one_package_only
      - id: SM-07
        measure: PII-in-logs incidents
        target: 0
        current: no_scan_in_place
      - id: SM-08
        measure: WCAG 2.2 AA critical or serious findings
        target: 0
        current: never_audited
      - id: SM-09
        measure: Unauthenticated production access
        target: 0
        current: all_access_is_unauthenticated
    assumptions:
      - id: A-01
        assumption: >-
          Order number plus product code uniquely identifies an order line across
          every source. Implemented as the deduplication natural key.
      - id: A-02
        assumption: >-
          The daily provisioning failure email is a complete snapshot; absence of
          a previously reported failure means it is resolved.
      - id: A-03
        assumption: Order numbers in the failure report join exactly to orders.order_number.
      - id: A-04
        assumption: A single operating unit; no tenancy boundary is required.
      - id: A-05
        assumption: >-
          Upstream export formats are stable enough that column mapping changes
          are occasional and can be made in Settings.
    risks:
      - id: R-01
        risk: Public unauthenticated access to personal data
        severity: critical
        mitigation: ENG-701
      - id: R-02
        risk: Container-only build failures escape CI
        severity: critical
        mitigation: ENG-704
        evidence: two_production_incidents
      - id: R-03
        risk: A bad rule change reclassifies the whole estate on reapply
        severity: material
        mitigation: rule preview endpoint exists; no approval step (OQ-08)
      - id: R-04
        risk: Crash between import and classification leaves orders unclassified
        severity: material
        mitigation: ENG-802 transactional outbox
      - id: R-05
        risk: Upstream export format drift breaks ingestion
        severity: material
        mitigation: >-
          Column mapping is configurable and mismatch produces one actionable,
          self-diagnosing error; RB-05 runbook required.
      - id: R-06
        risk: Rollback across a schema change is unsafe (no down migrations)
        severity: critical
        mitigation: ENG-709

  personas:
    - id: P-01
      role: Operations Analyst
      needs:
        - see what needs working now, in priority order
        - understand why an order is in a queue
        - correct or annotate without leaving the queue
      pain_points:
        - rebuilds an Excel view by hand
        - no shared source of truth
      accessibility_considerations:
        - dense data grid used all day; keyboard operation and focus order matter
        - status must never be conveyed by colour alone
      privacy_considerations:
        - sees customer names and email addresses
      evidence_source: stated_by_requestor
    - id: P-02
      role: Operations Manager
      needs:
        - trend and mix over time
        - where the backlog concentrates
        - whether it is improving
      pain_points:
        - point-in-time snapshots only
      accessibility_considerations:
        - chart data must also be reachable as numbers, not chart-only
      evidence_source: stated_by_requestor
    - id: P-03
      role: Resolver team member (Order Management, Customer Data, ActiveHub Support, Platform Engineering)
      needs:
        - to be told which failures are theirs
        - a concrete next step
      pain_points:
        - failure emails read by one person and forwarded ad hoc
      evidence_source: stated_by_requestor
    - id: P-04
      role: Control Tower Administrator
      needs:
        - add a data source without a code change
        - change classification rules without a release
      pain_points:
        - logic lived in spreadsheet formulas known to one person
      evidence_source: stated_by_requestor
    - id: P-05
      role: Auditor / Reviewer
      needs:
        - evidence of what changed, when and by whom
        - why an order was classified as it was
      pain_points:
        - no audit trail existed
      evidence_source: inferred_from_requirements

  functional_requirements:
    - id: FR-01
      title: Dashboard headline metrics
      description: >-
        Show total, completed, pending, customer impacted, exception and
        cancelled counts on the control tower dashboard.
      priority: must
      rationale: Replaces the top row of the Excel dashboard.
      acceptance_criteria:
        - Given orders exist, when the dashboard opens, then all six counts are shown.
        - Given the summary has not resolved, when the dashboard renders, then a
          non-interactive placeholder is shown rather than a misleading zero.
      dependencies: [FR-05]
      risks: []
      traceability: [US-01, ENG-P4, GET /api/v1/dashboard/summary]
      delivered: true
    - id: FR-02
      title: Stacked-bar order trend with selectable granularity
      description: >-
        Show order volume over time as a stacked bar chart segmented by
        classification, switchable between daily, weekly and monthly buckets.
      priority: must
      rationale: Managers need mix over time, not just current totals.
      acceptance_criteria:
        - Given weekly granularity, when the chart renders, then each bar is one
          Monday-starting week.
        - Given a classification with no orders in a bucket, when the chart
          renders, then an explicit zero is contributed so the stack does not gap.
        - Given an empty intermediate bucket, when the chart renders, then the
          bucket is still present (gap-filled).
      dependencies: []
      risks: []
      traceability: [US-02, GET /api/v1/dashboard/trend, services/reporting]
      delivered: true
    - id: FR-03
      title: Range-scoped metric pills with drill-through
      description: >-
        When a trend range is selected, show a second row of metric pills scoped
        to that range; clicking one opens the matching queue filtered to the
        same range.
      priority: must
      rationale: The headline pills answer "now"; managers also need "this range".
      acceptance_criteria:
        - Given a 30-day range, when the pills render, then they summarise the
          queried window, not the first and last bucket boundaries.
        - Given a range is selected, when a pill is clicked, then the queue opens
          filtered to that range with a clearable range chip.
        - Given the trend request failed, when the pills render, then they show an
          error state and are not clickable.
      dependencies: [FR-02]
      risks: []
      traceability: [US-03, RangeMetricPills, services/reporting summariseTrend]
      delivered: true
    - id: FR-04
      title: Operational queues
      description: Named queues for Pending, Customer Impacted, Completed, Cancelled and Exceptions.
      priority: must
      rationale: Analysts work a queue, not a dashboard.
      acceptance_criteria:
        - Given a queue route, when it opens, then only orders of that
          classification are listed.
        - Given an unknown queue slug, when it is opened, then a 404 is returned.
      dependencies: [FR-05]
      risks: []
      traceability: [US-04, '/queues/[queue]']
      delivered: true
    - id: FR-05
      title: Server-driven orders grid with export
      description: >-
        Search, filter, sort, paginate and CSV-export all order lines, with all
        work performed server-side.
      priority: must
      rationale: The estate is too large for client-side grids.
      acceptance_criteria:
        - Given a large order set, when sorting or filtering, then the query runs
          server-side and honours the pagination contract.
        - Given an active filter, when exporting, then the export reflects that filter.
      dependencies: []
      risks: []
      traceability: [US-05, GET /api/v1/orders, GET /api/v1/orders/export]
      delivered: true
    - id: FR-06
      title: Order detail side panel
      description: >-
        Open any order in a drawer showing Details, Provisioning, Rule trace,
        History, Related lines and Audit.
      priority: must
      rationale: Triage requires the whole story without losing the queue position.
      acceptance_criteria:
        - Given an order, when the drawer opens, then all six tabs are populated
          from their respective endpoints.
        - Given related order lines share the order number, when Related opens,
          then those lines are listed.
      dependencies: [FR-05, FR-07]
      risks: []
      traceability: [US-06, GET /api/v1/orders/:id/*]
      delivered: true
    - id: FR-07
      title: Rule engine with persisted trace
      description: >-
        Evaluate enabled rules in ascending priority, first match wins, and
        persist the full evaluation trace.
      priority: must
      rationale: Every classification must be explainable.
      acceptance_criteria:
        - Given a classified order, when the trace is opened, then every rule
          evaluated is shown in priority order with match outcome.
        - Given a rule names an unregistered strategy, when it is evaluated, then
          the error is recorded in the trace and evaluation continues.
        - Given no rule matches, when evaluation completes, then the priority-1000
          catch-all classifies the order INVESTIGATE_REQUIRED.
      dependencies: []
      risks: []
      traceability: [US-07, services/classification, rule_executions]
      delivered: true
    - id: FR-08
      title: CSV ingestion with per-row error reporting
      description: >-
        Upload an ActiveHub CSV export; parse, normalise, deduplicate and report
        per-row errors.
      priority: must
      rationale: Manual upload is the primary ingestion path today.
      acceptance_criteria:
        - Given a tab-delimited file with a comma configured, when it is imported,
          then the delimiter is detected from the header and the import succeeds.
        - Given headers that do not fit the mapping, when it is imported, then one
          actionable error names the missing targets and quotes the headers found.
        - Given a header with a BOM, zero-width or non-breaking space, when it is
          matched, then it normalises to the same key used for row lookup.
        - Given a repeated (order_number, product_code), when it is imported, then
          the order is updated in place and a history snapshot is written.
      dependencies: []
      risks: [R-05]
      traceability: [US-08, services/ingestion, POST /api/v1/imports/upload]
      delivered: true
    - id: FR-09
      title: Configurable data sources
      description: >-
        Create, configure, test, enable, schedule and run data sources from
        Settings, including the column mapping.
      priority: must
      rationale: New sources must not require a release.
      acceptance_criteria:
        - Given a source type, when the form renders, then only the fields and
          upload affordances that connector declares are offered.
        - Given a configured source, when Test is used, then connectivity is
          verified without importing.
      dependencies: []
      risks: []
      traceability: [US-09, /settings/sources, /api/v1/sources]
      delivered: true
    - id: FR-10
      title: Rule authoring, preview and reapply
      description: >-
        Create, edit, prioritise, enable, preview and reapply classification
        rules from Settings.
      priority: must
      rationale: Operations owns the classification logic.
      acceptance_criteria:
        - Given a draft rule, when Preview is used, then the orders it would match
          are shown without persisting a classification.
        - Given rules were changed, when Reapply is used, then existing orders are
          reclassified and new traces written.
      dependencies: [FR-07]
      risks: [R-03]
      traceability: [US-10, /settings/rules, POST /api/v1/rules/preview, POST /api/v1/rules/reapply]
      delivered: true
    - id: FR-11
      title: Provisioning failure report ingestion
      description: >-
        Ingest the daily downstream provisioning failure report, categorise each
        failure, attach an owning team and suggested action, and join it to
        orders by order number.
      priority: must
      rationale: >-
        Adds the detail that identifies which orders have customer impact and who
        owns the next step.
      acceptance_criteria:
        - Given a failure for order number X, when the report is imported, then it
          is categorised, routed to an owning team and joined to every order line
          with that order number.
        - Given a fixed-width wrapped line, when it is parsed, then the
          continuation is rejoined and only recognised labels start a new field.
        - Given a matching order already exists, when the import completes, then
          the affected orders are reclassified so the priority-15 rule takes effect.
      dependencies: [FR-08]
      risks: []
      traceability: [US-11, services/ingestion failure-report-parser, provisioning_failures]
      delivered: true
    - id: FR-12
      title: Provisioning failures queue with ownership routing
      description: >-
        A queue of unresolved provisioning failures grouped by owning team and
        root cause, each with a suggested next step.
      priority: must
      rationale: Resolver teams must be able to find their own work.
      acceptance_criteria:
        - Given unresolved failures, when the queue opens, then they are grouped by
          owning team and by root cause with counts.
        - Given includeResolved=false, when the list is requested, then resolved
          failures are excluded.
      dependencies: [FR-11]
      risks: []
      traceability: [US-12, /failures, GET /api/v1/failures, GET /api/v1/failures/breakdown]
      delivered: true
    - id: FR-13
      title: Failure lifecycle — resolve, reassign, auto-resolve
      description: >-
        Failures can be resolved or reassigned by an operator, and auto-resolve
        when they stop appearing in the daily snapshot.
      priority: must
      rationale: The report is a snapshot; absence means resolved.
      acceptance_criteria:
        - Given a failure absent from today's report and every report line matched,
          when the import completes, then it auto-resolves — but only if the order
          was imported more recently than the failure was last seen.
        - Given a failure reported in today's report, when auto-resolve runs, then
          it is not closed.
        - Given an operator resolves or reassigns a failure, when it completes,
          then an audit record is written and history is not rewritten.
      dependencies: [FR-11]
      risks: []
      traceability: [US-13, failures.service autoResolveReconciled, POST /api/v1/failures/:id/resolve]
      delivered: true
    - id: FR-14
      title: Import history
      description: Every import run is recorded with counts, status, duration and per-row errors.
      priority: must
      rationale: Operators must be able to see what an import actually did.
      acceptance_criteria:
        - Given a completed import, when history is opened, then row counts, status
          and any errors are shown.
      dependencies: [FR-08]
      risks: []
      traceability: [US-14, /imports, GET /api/v1/imports/runs]
      delivered: true
    - id: FR-15
      title: Audit trail
      description: Every state change is recorded immutably with actor, action, entity and before/after.
      priority: must
      rationale: Governance and incident investigation.
      acceptance_criteria:
        - Given any create, update, delete, import, resolve or reassign, when it
          completes, then an audit record exists with actor, action, entity,
          before/after and timestamp.
      dependencies: []
      risks:
        - Actor is anonymous while authentication is disabled (BLK-01).
      traceability: [US-15, audit_logs, GET /api/v1/audit]
      delivered: true
    - id: FR-16
      title: Saved views
      description: Save a filtered order view and return to it.
      priority: should
      rationale: Analysts return to the same slices repeatedly.
      acceptance_criteria:
        - Given a filter set, when it is saved, then it can be reopened later with
          the same filters applied.
      dependencies: [FR-05]
      risks: []
      traceability: [US-16, saved_views, /api/v1/views]
      delivered: true
    - id: FR-17
      title: Authentication and role-based authorisation
      description: >-
        Microsoft Entra ID OIDC authentication with a role hierarchy of
        admin ⊃ operator ⊃ viewer applied per endpoint.
      priority: must
      rationale: The platform holds personal data and operational controls.
      acceptance_criteria:
        - Given AUTH_ENABLED=true, when an unauthenticated request arrives, then it
          is rejected with 401.
        - Given a viewer token, when a state-changing endpoint is called, then it is
          rejected with 403.
        - Given an admin token, when any endpoint is called, then it is permitted.
      dependencies: []
      risks: [R-01]
      traceability: [US-17, JwtAuthGuard, RolesGuard, roles.guard.spec]
      delivered: implemented_but_disabled_in_production
      blocker: BLK-01
    - id: FR-18
      title: Operational observability
      description: >-
        Structured JSON logging with correlation IDs, liveness and readiness
        probes, Prometheus metrics and opt-in OpenTelemetry tracing.
      priority: must
      rationale: The platform must be operable.
      acceptance_criteria:
        - Given the service is running, when /healthz and /readyz are called, then
          they report liveness and dependency readiness respectively.
        - Given a request, when it is logged, then the log line is JSON and carries
          a correlation ID.
      dependencies: []
      risks: []
      traceability: [US-18, apps/api/src/observability]
      delivered: true
    - id: FR-19
      title: Scheduled source imports
      description: An enabled source with a cron schedule imports without human action.
      priority: should
      rationale: Manual upload should not be the only path.
      acceptance_criteria:
        - Given an enabled source with a cron schedule, when the schedule fires,
          then an import run is created and executed.
      dependencies: [FR-09]
      risks:
        - No enabled source currently carries a schedule, so this path is not
          exercised in production (ENG-807).
      traceability: [US-19, imports/scheduler.service.ts]
      delivered: code_delivered_not_exercised_in_production

  ux_and_accessibility:
    design_system: MUI v6 with MUI X DataGrid; local component library in packages/ui-components
    brand_alignment: >-
      Not assessed against Pearson brand or the Pearson Design System. The
      platform uses stock MUI with a local theme.
    journeys:
      - id: UX-J01
        name: Morning triage
        persona: P-01
        steps:
          - Open the dashboard and read the headline pills
          - Notice Customer Impacted is elevated
          - Click through to the Customer Impacted queue
          - Open an order in the drawer
          - Read the Provisioning tab to see the failure and owning team
          - Read the Rule trace tab to see why it was classified
        surfaces: [dashboard, queues, order drawer]
      - id: UX-J02
        name: Range investigation
        persona: P-02
        steps:
          - Switch the trend to monthly
          - Select a range
          - Read the range-scoped pills
          - Click a pill to drill into that classification for that range
          - Clear the range chip to widen back out
        surfaces: [dashboard, trend chart, range pills, orders grid]
      - id: UX-J03
        name: Daily failure report upload
        persona: P-01
        steps:
          - Open Import
          - Choose the provisioning failure report source
          - Pick the .txt report (the picker offers what that connector declares)
          - Upload and read the run summary
          - Open the Provisioning Failures queue grouped by owning team
        surfaces: [imports, failures queue]
      - id: UX-J04
        name: Change a classification rule
        persona: P-04
        steps:
          - Open Settings, Classification Rules
          - Edit or add a rule and set its priority
          - Preview which orders it would match
          - Save, then reapply rules
        surfaces: [settings/rules]
      - id: UX-J05
        name: Onboard a new data source
        persona: P-04
        steps:
          - Open Settings, Data Sources
          - Add a source and choose its type
          - Configure connection and column mapping
          - Test, then enable, optionally with a schedule
        surfaces: [settings/sources]
    interaction_requirements:
      - Server-driven grid: pagination, sorting and filtering are round-tripped.
      - Drill-through preserves the active date range as query parameters.
      - The upload picker's accepted extensions come from the connector's own
        declaration, and the server validates against the same declaration.
      - Status is conveyed by label as well as colour (StatusChip).
    content_requirements:
      - British English throughout.
      - Import errors must name the offending row and field and quote the input.
      - Failure suggested actions must state the next step, not the diagnosis alone.
    error_states:
      - Import error report per row, surfaced in the run detail.
      - Column mapping mismatch produces one actionable, self-diagnosing message.
      - Trend and pill failure states render an error and disable interaction.
    empty_states:
      - EmptyState component used across queues, failures and import history.
    loading_states:
      - Range pills render a non-interactive placeholder until data resolves.
      - Grid uses the DataGrid loading state during server round-trips.
    accessibility:
      target_standard: WCAG 2.2 AA
      eaa_alignment_required: true
      test_requirements:
        - automated axe checks in CI (not implemented — ENG-707)
        - keyboard-only pass of dashboard, grid, drawer and dialogs (not performed)
        - screen reader pass, at least one AT combination (not performed)
        - colour contrast verification of classification colours (not performed)
        - chart data available as an accessible alternative (not verified)
      known_risks:
        - id: A11Y-R01
          risk: MUI X DataGrid keyboard and screen-reader behaviour in a dense grid unverified
        - id: A11Y-R02
          risk: Recharts stacked bars have no accessible text alternative
        - id: A11Y-R03
          risk: Classification colour palette contrast never measured
        - id: A11Y-R04
          risk: Drawer focus trap and return-focus behaviour unverified
      status: no_accessibility_review_has_been_performed
      blocker: BLK-06
    acceptance_criteria:
      - Every interactive control is reachable and operable by keyboard.
      - No information is conveyed by colour alone.
      - Every form control has a programmatic label.
      - Drawer and dialog focus is trapped and returned on close.

  architecture:
    current_state:
      pattern: modular_monolith
      description: >-
        A Next.js web app calls a NestJS API. Domain logic lives in three
        dependency-free workspace libraries consumed by the API as libraries, so
        they can later be lifted into workers without a rewrite. PostgreSQL via
        Prisma. Orchestration by an in-process typed event bus.
      deployed_on: railway
      authentication_enforced: false
    target_state:
      description: >-
        Unresolved. Original intent was Azure App Service / Container Apps with
        Entra ID enforced and Azure Service Bus replacing the in-process event
        bus. Delivered state is Railway with authentication disabled.
      open_decisions: [ADR-12, ADR-15]
    platform_context:
      upstream:
        - name: ActiveHub
          interface: CSV export
          direction: inbound
        - name: downstream provisioning system
          interface: daily failure report (email, fixed-width text)
          direction: inbound
      downstream: []
      write_back: none
    logical_components:
      - id: C-01
        name: apps/web
        type: frontend
        stack: Next.js 15 App Router, MUI v6, TanStack Query, Zustand, Recharts
        notes: output standalone; transpiles the shared workspace packages
      - id: C-02
        name: apps/api
        type: backend
        stack: NestJS, global prefix /api, URI versioning v1, Swagger at /api/docs
      - id: C-03
        name: services/ingestion
        type: domain_library
        responsibility: connector registry, CSV parsing, header normalisation, failure report parsing
        dependencies: none (no Nest, no Prisma)
      - id: C-04
        name: services/classification
        type: domain_library
        responsibility: rule engine and strategy registry
        dependencies: none
      - id: C-05
        name: services/reporting
        type: domain_library
        responsibility: trend bucketing, range summaries, operational health
        dependencies: none
      - id: C-06
        name: packages/shared-types
        type: contract_library
        responsibility: enums, DTOs and event names shared end to end
      - id: C-07
        name: packages/ui-components
        type: ui_library
        responsibility: StatCard, StatusChip, EmptyState, PageHeader, ConfirmDialog
      - id: C-08
        name: PostgreSQL
        type: datastore
        access: Prisma ORM with hand-written migrations
    integration_patterns:
      - id: IP-01
        pattern: batch_file_ingestion
        detail: manual upload and file drop, parsed and normalised before persistence
      - id: IP-02
        pattern: scheduled_pull
        detail: cron-scheduled connector fetch (implemented; not exercised in production)
      - id: IP-03
        pattern: in_process_event_bus
        detail: >-
          Typed events with centrally declared names, chosen as a seam for a
          future Azure Service Bus transport.
      - id: IP-04
        pattern: denormalised_read_model
        detail: >-
          Latest unresolved provisioning failure is copied onto orders so queues,
          filters and the rule engine need no join.
    api_contracts:
      base_path: /api/v1
      openapi: served at /api/docs
      auth: bearer JWT (Entra ID) when AUTH_ENABLED=true
      endpoints:
        - { method: GET,    path: '/orders',                 role: viewer }
        - { method: GET,    path: '/orders/export',          role: viewer }
        - { method: GET,    path: '/orders/{id}',            role: viewer }
        - { method: GET,    path: '/orders/{id}/trace',      role: viewer }
        - { method: GET,    path: '/orders/{id}/history',    role: viewer }
        - { method: GET,    path: '/orders/{id}/related',    role: viewer }
        - { method: GET,    path: '/orders/{id}/audit',      role: viewer }
        - { method: GET,    path: '/orders/{id}/failures',   role: viewer }
        - { method: POST,   path: '/orders/bulk',            role: operator }
        - { method: GET,    path: '/dashboard/summary',      role: viewer }
        - { method: GET,    path: '/dashboard/by-status',    role: viewer }
        - { method: GET,    path: '/dashboard/by-product',   role: viewer }
        - { method: GET,    path: '/dashboard/by-source',    role: viewer }
        - { method: GET,    path: '/dashboard/trend',        role: viewer }
        - { method: GET,    path: '/dashboard/health',       role: viewer }
        - { method: POST,   path: '/imports/upload',         role: operator }
        - { method: GET,    path: '/imports/runs',           role: viewer }
        - { method: GET,    path: '/imports/runs/{id}',      role: viewer }
        - { method: GET,    path: '/sources',                role: viewer }
        - { method: GET,    path: '/sources/types',          role: viewer }
        - { method: GET,    path: '/sources/{id}',           role: viewer }
        - { method: POST,   path: '/sources',                role: admin }
        - { method: PATCH,  path: '/sources/{id}',           role: admin }
        - { method: DELETE, path: '/sources/{id}',           role: admin }
        - { method: POST,   path: '/sources/{id}/test',      role: admin }
        - { method: POST,   path: '/sources/{id}/run',       role: operator }
        - { method: GET,    path: '/sources/{id}/runs',      role: viewer }
        - { method: GET,    path: '/rules',                  role: viewer }
        - { method: GET,    path: '/rules/strategies',       role: viewer }
        - { method: POST,   path: '/rules',                  role: admin }
        - { method: PATCH,  path: '/rules/{id}',             role: admin }
        - { method: DELETE, path: '/rules/{id}',             role: admin }
        - { method: POST,   path: '/rules/preview',          role: admin }
        - { method: POST,   path: '/rules/reapply',          role: operator }
        - { method: GET,    path: '/failures',               role: viewer }
        - { method: GET,    path: '/failures/breakdown',     role: viewer }
        - { method: POST,   path: '/failures/{id}/resolve',  role: operator }
        - { method: POST,   path: '/failures/reassign',      role: operator }
        - { method: POST,   path: '/failures/resync',        role: operator }
        - { method: GET,    path: '/audit',                  role: viewer }
        - { method: GET,    path: '/views',                  role: viewer }
        - { method: POST,   path: '/views',                  role: viewer }
        - { method: DELETE, path: '/views/{id}',             role: viewer }
      unversioned_operational_endpoints:
        - { method: GET, path: '/healthz', auth: public }
        - { method: GET, path: '/readyz',  auth: public }
        - { method: GET, path: '/metrics', auth: public }
      notes:
        - >-
          /metrics is currently unauthenticated. Review before any exposure
          beyond the internal network (BLK-12).
        - >-
          No idempotency keys on state-changing POSTs. This diverges from the
          Pearson guardrail; ingestion is idempotent by natural key instead.
          Recorded as EXC-04.
    event_contracts:
      transport: in_process (@nestjs/event-emitter)
      naming_source: packages/shared-types/src/events.ts
      events:
        - name: order.imported
          schema_version: 1
          contains_pii: false
          payload: [orderId, orderNumber, productCode, importRunId, sourceId, actor]
        - name: order.updated
          schema_version: 1
          contains_pii: false
          payload: [orderId, orderNumber, productCode, importRunId, sourceId, actor, changedFields]
        - name: order.classified
          schema_version: 1
          contains_pii: false
          payload: [orderId, orderNumber, productCode, classification, previousClassification, ruleName, evaluationId, actor]
        - name: order.reclassified
          schema_version: 1
          contains_pii: false
        - name: import.completed
          schema_version: 1
          contains_pii: false
          payload: [importRunId, sourceId, successfulRows, failedRows, actor]
        - name: import.failed
          schema_version: 1
          contains_pii: false
          payload: [importRunId, sourceId, error, actor]
      change_control: >-
        Event names and payload shapes are a contract. Changing either requires
        human sign-off (see agent_manifest.guardrails.human_sign_off_required_for).
    architecture_decisions:
      - id: ADR-01
        decision: >-
          Modular monolith with domain logic in dependency-free workspace
          libraries consumed by the API.
        status: implemented_unratified
        consequences: Splittable into workers later; single deployable today.
      - id: ADR-02
        decision: >-
          Classification via the strategy pattern with a registry; rules are
          database rows evaluated ascending by priority, first match wins, with a
          persisted trace.
        status: implemented_unratified
        strategies: [field-match, order-age, always]
      - id: ADR-03
        decision: >-
          Ingestion via the strategy pattern with a connector registry; each
          connector declares its own capabilities and both the UI picker and
          server-side upload validation derive from that declaration.
        status: implemented_unratified
      - id: ADR-04
        decision: >-
          Deduplicate on the natural key (order_number, product_code); snapshot
          previous values to order_history on every overwrite.
        status: implemented_unratified
      - id: ADR-05
        decision: >-
          In-process typed event bus with centrally declared event names, as a
          seam for a future Azure Service Bus transport.
        status: implemented_unratified
        risk: no outbox, no retry (R-04)
      - id: ADR-06
        decision: >-
          Denormalise the latest unresolved provisioning failure onto orders;
          provisioning_failures remains the record of truth.
        status: implemented_unratified
      - id: ADR-07
        decision: >-
          Treat the daily failure email as a snapshot. Auto-resolve requires that
          every report line matched AND that the order was imported more recently
          than the failure was last seen, using imported_at rather than
          updated_at because our own summary writes touch updated_at.
        status: implemented_unratified
      - id: ADR-08
        decision: >-
          Ownership routing is a static table applied at import time and stored on
          the failure, so reassignment never rewrites history.
        status: implemented_unratified
      - id: ADR-09
        decision: >-
          Prisma with hand-written SQL migrations and an idempotent seed at
          container boot that also retires superseded rules and sources and
          migrates legacy column mappings.
        status: implemented_unratified
        risk: unattended write path against production data
      - id: ADR-10
        decision: >-
          Entra ID OIDC authentication with a role hierarchy admin ⊃ operator ⊃
          viewer, and an AUTH_ENABLED=false bypass intended for local development.
        status: implemented_but_disabled_in_production
        blocker: BLK-01
      - id: ADR-11
        decision: >-
          Next.js 15 App Router with standalone output, MUI v6 and MUI X DataGrid
          server-driven, Recharts for visualisation.
        status: implemented_unratified
      - id: ADR-12
        decision: Hosting platform — Railway (delivered) versus Azure (intended).
        status: open
        severity: critical
      - id: ADR-13
        decision: Whether CI must build the container images.
        status: open
        severity: critical
        evidence: two production incidents caused by container-only build failures
      - id: ADR-14
        decision: >-
          No AI or ML inference in the classification path; classification stays
          deterministic, inspectable and human-editable.
        status: confirmed_by_omission_record_explicitly
      - id: ADR-15
        decision: Data residency and hosting region for order and customer data.
        status: open
        severity: critical
    non_functional_requirements:
      api_p95_latency_ms: 500
      api_p95_status: not_load_tested
      availability_target: 0.995
      availability_status: no_slo_instrumentation
      coverage_floor_new_code: 0.80
      coverage_enforcement: services/classification only
      pii_in_logs_tolerance: 0
      pii_in_logs_enforcement: none
      wcag: 2.2-AA
      wcag_status: never_audited
      security_baseline: OWASP_ASVS_L2
      security_baseline_status: partial_authentication_not_enforced
      audit_coverage_required: 1.0
      audit_coverage_evidence: not_sampled
      import_determinism: same file twice produces no duplicate order lines
      rule_engine_resilience: unknown or failing strategy is traced, never thrown
      data_residency: undetermined
      backup_and_restore: undocumented_and_untested
    resilience_model:
      failure_modes:
        - id: FM-01
          mode: crash between import and classification
          current_behaviour: order remains unclassified until a manual reapply
          mitigation: ENG-802 transactional outbox
        - id: FM-02
          mode: denormalised provisioning summary drifts from provisioning_failures
          current_behaviour: repairable via POST /failures/resync
          mitigation: ENG-806 drift detection
        - id: FM-03
          mode: upstream export format change
          current_behaviour: one actionable self-diagnosing import error
          mitigation: RB-05 runbook
        - id: FM-04
          mode: rollback across a schema change
          current_behaviour: unsafe — no down migrations
          mitigation: ENG-709 plus a down-migration policy
    security_model:
      authentication: Entra ID OIDC, JWKS validated, passport-jwt
      authorisation: role hierarchy admin ⊃ operator ⊃ viewer, applied per endpoint
      transport: HTTPS terminated at the platform edge
      headers: helmet
      cors: explicit origin allowlist from CORS_ORIGINS
      input_validation: global ValidationPipe, whitelist and forbidNonWhitelisted, transform
      injection: Prisma parameterised queries throughout
      current_gap: AUTH_ENABLED=false in production (BLK-01)
    observability_model:
      logging: structured JSON with correlation IDs
      probes: [/healthz, /readyz]
      metrics: Prometheus at /metrics
      tracing: OpenTelemetry, opt-in via OTEL_ENABLED
      error_tracking: ErrorTrackingService seam, no provider wired
      gaps: [no dashboards, no alert routing, no SLOs, no on-call]
    platform_reuse_implications:
      - >-
        The connector and strategy registries are the intended reuse seams; new
        sources and new classification behaviour should be added there rather
        than by branching the orchestrator.
      - >-
        services/* carry no framework dependency and can be reused by a worker or
        a different host process.
    risks:
      - ARCH-R01 in-process event bus with no outbox or retry
      - ARCH-R02 denormalised provisioning summary can drift undetected
      - ARCH-R03 seed-at-boot mutates production data unattended
      - ARCH-R04 no tenancy model
      - ARCH-R05 scientific-notation ISBNs from the upstream export are unrecoverable in code

  data_and_integration:
    data_entities:
      - name: orders
        description: One row per order line, the deduplicated core entity
        natural_key: [order_number, product_code]
        personal_data: true
        personal_data_fields: [customer_name, customer_email, customer_id]
        source_of_truth: ActiveHub (upstream); this table is a derived operational copy
        classification: internal_confidential
        retention: undefined
        notes: >-
          Carries a denormalised summary of the latest unresolved provisioning
          failure (provisioning_category, provisioning_owner, provisioning_failed_at).
      - name: order_history
        description: Snapshot of previous values written on every overwrite
        personal_data: true
        retention: undefined
      - name: sources
        description: Configured data sources including type, connection and column mapping
        personal_data: false
        notes: connection configuration may contain secrets — review storage (BLK-12)
        retention: lifetime_of_source
      - name: import_runs
        description: One row per import execution with counts, status and error report
        personal_data: possible_in_error_rows
        retention: undefined
      - name: classification_rules
        description: Database-driven rules; ten seeded with unique priorities
        personal_data: false
        retention: lifetime_of_platform
      - name: rule_executions
        description: Persisted evaluation trace per order per evaluation
        personal_data: false
        retention: undefined
      - name: provisioning_failures
        description: Record of truth for downstream provisioning failures and their lifecycle
        personal_data: false
        retention: undefined
      - name: audit_logs
        description: Immutable record of state changes
        personal_data: true
        personal_data_fields: [actor]
        retention: undefined
      - name: saved_views
        description: Per-user saved filter sets
        personal_data: true
        personal_data_fields: [owner]
        retention: undefined
      - name: daily_aggregates
        description: Precomputed daily rollups for reporting
        personal_data: false
        retention: undefined
    seeded_classification_rules:
      - { priority: 10,   name: Cancelled orders,                  strategy: field-match, outcome: CANCELLED }
      - { priority: 15,   name: Provisioning failed downstream,    strategy: field-match, outcome: CUSTOMER_IMPACTED }
      - { priority: 20,   name: Paid but no licence provisioned,   strategy: field-match, outcome: CUSTOMER_IMPACTED }
      - { priority: 30,   name: Wrong product licensed,            strategy: field-match, outcome: INVESTIGATE_REQUIRED }
      - { priority: 40,   name: Data quality exception,            strategy: field-match, outcome: EXCEPTION }
      - { priority: 50,   name: Completed and fully reconciled,    strategy: field-match, outcome: COMPLETED }
      - { priority: 60,   name: Stale incomplete order,            strategy: order-age,   outcome: INVESTIGATE_REQUIRED }
      - { priority: 70,   name: In fulfilment,                     strategy: field-match, outcome: PLACED }
      - { priority: 80,   name: Pending orders,                    strategy: field-match, outcome: PENDING }
      - { priority: 1000, name: Catch-all — investigate,           strategy: always,      outcome: INVESTIGATE_REQUIRED }
    failure_ownership_routing:
      - { category: TEP_ACCOUNT_MISSING,      owner: Customer Data }
      - { category: INVALID_CUSTOMER_DATA,    owner: Customer Data }
      - { category: DUPLICATE_ORG_MEMBERSHIP, owner: ActiveHub Support }
      - { category: LICENCE_CONFIG_ERROR,     owner: Order Management }
      - { category: INTEGRATION_FAULT,        owner: Platform Engineering }
      - { category: UNCATEGORISED,            owner: Triage }
    source_types:
      - { type: CSV_UPLOAD,           implemented: true }
      - { type: CSV_FILE,             implemented: true }
      - { type: REST_API,             implemented: true }
      - { type: AZURE_BLOB,           implemented: true }
      - { type: EMAIL_FAILURE_REPORT, implemented: true }
      - { type: SFTP,                 implemented: false, state: registered_stub }
      - { type: SHAREPOINT,           implemented: false, state: registered_stub }
      - { type: TABLEAU,              implemented: false, state: registered_stub }
    data_flows:
      - id: DF-01
        name: Order import
        steps:
          - connector fetch or manual upload
          - delimiter detection and header normalisation
          - column mapping to the canonical order shape
          - per-row validation with an actionable error report
          - upsert on (order_number, product_code) with an order_history snapshot
          - emit order.imported or order.updated
          - classify and persist the rule trace
          - emit order.classified
          - sync provisioning summaries and reclassify affected orders
          - emit import.completed
      - id: DF-02
        name: Provisioning failure report import
        steps:
          - parse fixed-width report, rejoining wrapped continuation lines
          - categorise each failure, most-specific matcher first
          - attach owning team and suggested action from the routing table
          - upsert failures, incrementing occurrences and updating last_seen_at
          - join to orders by order number
          - auto-resolve absent failures subject to the completeness and recency guards
          - sync denormalised order summaries and reclassify changed orders
    error_handling:
      import: per-row error report persisted on the import run; the run completes with errors rather than failing whole
      mapping_mismatch: one actionable error naming missing targets and quoting the headers found
      unknown_rule_strategy: recorded in the trace as an error; evaluation continues
      api: global exception filter with structured logging and an error-tracking seam
    idempotency:
      ingestion: idempotent by natural key (order_number, product_code)
      failure_report: idempotent by (order_number, contract_number) with occurrence counting
      state_changing_posts: no idempotency keys — divergence recorded as EXC-04
    monitoring:
      implemented: [structured logs, health probes, prometheus metrics, in-app operational health view]
      missing: [dashboards, alert routing, SLOs]
    data_quality_requirements:
      - id: DQ-01
        requirement: Order number and product code must be present on every row
        enforcement: import validation, row rejected with an actionable error
      - id: DQ-02
        requirement: Dates must parse from dd/mm/yyyy or ISO
        enforcement: parseDate in services/ingestion
      - id: DQ-03
        requirement: ISBN must not arrive in scientific notation
        enforcement: >-
          Detected (isScientificNotation) but unrecoverable in code. Must be fixed
          at source by formatting the ActiveHub export column as Text.
        status: open_upstream_action
      - id: DQ-04
        requirement: COMPLETED requires both licence match flags to read Match
        enforcement: priority-50 seeded rule
    auditability:
      coverage: all state-changing operations
      fields: [actor, action, entity, entity_id, before, after, timestamp]
      immutability: append only
      current_gap: actor is anonymous while authentication is disabled

  responsible_ai_and_safeguarding:
    ai_present: false
    ai_capability_type: none
    rationale: >-
      Classification is deterministic and rule-based by design (ADR-14) so that
      every outcome is explainable, reproducible and editable by operations
      without a model, a training set or a review of automated decision-making.
    principles:
      - No AI inference in the classification path.
      - No automated commercial or customer-affecting decision; classification
        changes triage priority only.
    approved_ai_activities:
      - AI-assisted software development within the guardrails in this file.
    prohibited_ai_activities:
      - introducing model inference into classification without a new POLARIS review
      - sending order or customer data to any third-party model or service
      - training or evaluating any model on this data
    controls:
      - ADR-14 recorded explicitly
      - guardrail entry forbidding AI in the classification path
    model_and_prompt_governance: {}
    safeguarding:
      enabled: false
      risk_categories: []
      controls: []
      notifications: []
      emergency_behaviour: {}
    note: >-
      This section covers the product. AI was used to build the software; the
      controls governing that are in agent_manifest.guardrails.

  security:
    authentication:
      mechanism: Microsoft Entra ID OIDC, JWT validated against JWKS
      library: passport-jwt
      dev_bypass: AUTH_ENABLED=false
      production_state: 🔴 disabled — every visitor is treated as an admin
      blocker: BLK-01
    authorisation:
      model: role hierarchy admin ⊃ operator ⊃ viewer
      enforcement: RolesGuard with per-endpoint @Roles decorators
      group_mapping: not defined (OQ-04)
      tested: roles.guard.spec covers the hierarchy
    data_protection:
      in_transit: HTTPS at the platform edge
      at_rest: managed Postgres encryption at rest (provider default, not verified)
      secrets: environment variables; no rotation policy, no secret scanning (BLK-12)
      pii_handling: no automated verification that PII stays out of logs (BLK-09)
    threat_model:
      status: not_performed
      blocker: BLK-12
      unmodelled_boundaries:
        - file upload (untrusted input, parsed server-side)
        - source connection configuration (may hold credentials)
        - unauthenticated /metrics endpoint
        - public production surface while authentication is disabled
    security_testing:
      dependency_scanning: none
      secret_scanning: none
      sast: none
      dast: none
      penetration_test: none
      implemented_controls:
        - helmet security headers
        - CORS origin allowlist
        - global validation pipe rejecting unknown properties
        - Prisma parameterised queries
        - per-endpoint RBAC
    risks:
      - id: SEC-R01
        risk: Public unauthenticated access to a system holding personal data
        severity: critical
        blocker: BLK-01
      - id: SEC-R02
        risk: No dependency or secret scanning in CI
        severity: critical
        blocker: BLK-12
      - id: SEC-R03
        risk: Upload path is an unmodelled untrusted input boundary
        severity: material
      - id: SEC-R04
        risk: /metrics is unauthenticated
        severity: material

  engineering:
    repositories:
      - name: ragpark/controltower
        type: monorepo
        workspaces: [packages/*, services/*, apps/*]
        default_branch: main
    implementation_approach: >-
      npm workspaces monorepo. Domain logic in dependency-free libraries; Nest
      modules orchestrate but hold no business rules. Defects are fixed at the
      root cause and always ship with a regression test that fails before the fix.
    delivered_increments:
      - { pr: 1, summary: Platform foundation — monorepo, schema, ingestion, classification, API, web }
      - { pr: 2, summary: Align the data model and sample data to the real ActiveHub export }
      - { pr: 3, summary: Detect the CSV delimiter instead of blaming the column mapping }
      - { pr: 4, summary: Ingest the daily provisioning failure report and route ownership }
      - { pr: 5, summary: Make the upload picker follow the selected source; validate against the connector's declared extensions }
      - { pr: 6, summary: Stacked-bar order trend with range-scoped headline metrics and drill-through }
    implementation_tasks:
      p0_governance_blocks_certification:
        - ENG-B01_portfolio_reuse_review
        - ENG-B02_polaris_data_privacy_review
        - ENG-B03_name_owners
        - ENG-B04_ratify_adr_01_to_11_and_close_adr_12_13_15
        - ENG-B05_record_adr_14_no_ai_in_classification
        - ENG-B06_confirm_lawful_basis_and_retention
      p7_production_hardening_blocks_release_ready:
        - ENG-701_enable_entra_id_in_production
        - ENG-702_map_entra_groups_to_roles
        - ENG-703_authenticated_principal_in_audit_trail
        - ENG-704_build_container_images_in_ci_and_boot_test
        - ENG-705_coverage_gate_across_all_workspaces
        - ENG-706_pii_in_logs_scan_in_ci
        - ENG-707_axe_accessibility_checks_in_ci
        - ENG-708_manual_wcag_2_2_aa_audit
        - ENG-709_document_and_test_backup_and_restore
        - ENG-710_author_runbooks
        - ENG-711_dependency_and_secret_scanning
        - ENG-712_threat_model_for_ingestion_and_upload
        - ENG-713_retention_and_deletion_job
        - ENG-714_alert_on_unclassified_orders
        - ENG-715_instrument_success_measures
      p8_scale_out:
        - ENG-801_azure_service_bus_transport
        - ENG-802_transactional_outbox
        - ENG-803_sftp_connector
        - ENG-804_sharepoint_connector
        - ENG-805_tableau_connector
        - ENG-806_detect_provisioning_summary_drift
        - ENG-807_schedule_a_source_in_production
        - ENG-808_shared_saved_views
        - ENG-809_seed_behind_an_explicit_human_gated_step
    blocked_tasks:
      until_blk_01_closes:
        - any_widening_of_access_or_exposure
        - ENG-703
      until_adr_12_closes:
        - ENG-801
        - infrastructure_work_targeting_a_specific_cloud
      until_owners_named:
        - ENG-B01
        - ENG-B02
        - ENG-713
    coding_standards:
      language: TypeScript strict; no `any` in new code
      domain_logic_location: services/* — dependency free and testable without a database
      test_requirement: every defect fix ships with a regression test that fails before the fix
      error_messages: actionable, quoting the offending input; never blame the user
      copy: British English
      build_invariants:
        - >-
          apps/api/tsconfig.build.json must keep rootDir "src" and exclude prisma.
          Without it, adding a file outside src/ silently moves the emitted
          entrypoint from dist/main.js to dist/src/main.js; npm run build reports
          success and the container crash-loops.
        - >-
          The Dockerfile `test -f` entrypoint guards exist to catch that class of
          failure at image build time. Do not remove them.
        - >-
          The web Dockerfile must copy every workspace package the app imports.
          npm creates a dangling symlink for a missing workspace and exits 0; the
          failure then surfaces as MODULE_NOT_FOUND during next build.
    ai_development_controls:
      see: agent_manifest.guardrails
    pull_request_requirements:
      - reference Spec ID OCT-001
      - reference the relevant ADR ids
      - reference the Task ID (ENG-xxx)
      - include unit tests
      - include contract tests when an API route, DTO or event surface changed
      - include accessibility checks for UI changes
      - pass PII-in-logs review
      - include an audit write for any state-changing operator action
      - approved by a named human reviewer
      - state whether the container images were built, since CI does not build them
    branch_strategy: trunk based; short-lived branches; squash merge to main; no direct commits to main
    dependency_controls:
      current: none
      required: ENG-711
    build_expectations:
      commands: [npm run build, npm test, npm run prisma:migrate]
      node: '>=20 (CI uses 22)'
      image_build: not performed in CI — BLK-05

  qa_and_verification:
    test_strategy:
      approach: >-
        Domain logic is tested without a database or a framework in services/*.
        The API layer is unit tested with mocks and integration tested against a
        real Postgres service container in CI. UI primitives are component tested.
      layers:
        - { layer: domain_unit, location: services/*, count: 147 }
        - { layer: api_unit, location: apps/api/src/**/*.spec.ts, count: 49 }
        - { layer: component, location: packages/ui-components, count: 8 }
        - { layer: api_integration_e2e, location: apps/api, count: runs_in_ci }
      total_unit_and_component_tests_passing: 204
      breakdown:
        ui-components: 8
        classification: 42
        ingestion: 87
        reporting: 18
        api: 49
    test_cases:
      - { id: TC-01, requirement: FR-08, case: tab-delimited file with comma configured imports successfully }
      - { id: TC-02, requirement: FR-08, case: unfitting mapping yields one actionable error quoting the headers found }
      - { id: TC-03, requirement: FR-08, case: BOM, zero-width and non-breaking-space headers normalise to the row-lookup key }
      - { id: TC-04, requirement: FR-08, case: re-importing the same natural key updates in place and snapshots history }
      - { id: TC-05, requirement: FR-07, case: unknown strategy is traced as an error and evaluation continues }
      - { id: TC-06, requirement: FR-07, case: no match falls through to the priority-1000 catch-all }
      - { id: TC-07, requirement: FR-07, case: COMPLETED requires both licence match flags to read Match }
      - { id: TC-08, requirement: FR-11, case: fixed-width continuation lines are rejoined and only recognised labels start a field }
      - { id: TC-09, requirement: FR-11, case: most-specific failure matcher wins }
      - { id: TC-10, requirement: FR-13, case: a failure reported today is never auto-closed by the same import }
      - { id: TC-11, requirement: FR-13, case: auto-resolve requires every report line to have matched }
      - { id: TC-12, requirement: FR-11, case: importing orders re-links and reclassifies against open failures }
      - { id: TC-13, requirement: FR-12, case: includeResolved=false excludes resolved failures }
      - { id: TC-14, requirement: FR-03, case: trend total derives from each bucket's own total, not the sum of classification counts }
      - { id: TC-15, requirement: FR-02, case: weekly buckets start on Monday and gaps are filled }
      - { id: TC-16, requirement: FR-09, case: an extension the connector does not declare is rejected server-side }
      - { id: TC-17, requirement: FR-17, case: role hierarchy admin ⊃ operator ⊃ viewer is enforced }
      - { id: TC-18, requirement: FR-10, case: seeded rules have unique priorities and expected outcomes }
    bdd_scenarios:
      - >-
        Given a previously reported failure is absent from today's report and
        every line of that report matched, When the import completes, Then the
        failure auto-resolves only if the order was imported more recently than
        the failure was last seen.
      - >-
        Given a rule references a strategy that is not registered, When the engine
        evaluates it, Then the error is recorded in the trace and evaluation
        continues without throwing.
      - >-
        Given a source configured with a comma delimiter and a tab-delimited file,
        When the file is imported, Then the delimiter is detected from the header
        and the import succeeds.
    coverage_requirements:
      target_new_code: 0.80
      enforced_in: [services/classification]
      not_enforced_in: [services/ingestion, services/reporting, apps/api, packages/ui-components]
      gap_task: ENG-705
    test_gaps:
      - { gap: no container image build or boot test, task: ENG-704, severity: critical }
      - { gap: no accessibility testing, automated or manual, task: ENG-707/ENG-708, severity: critical }
      - { gap: no load or soak test against the p95 NFR, task: ENG-715, severity: material }
      - { gap: no dependency scan, secret scan or threat model, task: ENG-711/ENG-712, severity: critical }
      - { gap: no coverage gate outside one package, task: ENG-705, severity: material }
      - { gap: no deployed-environment test that authentication is enforced, task: ENG-701, severity: critical }
      - { gap: no restore test, task: ENG-709, severity: critical }
    defect_management:
      severities:
        S1: data loss, unauthorised access, PII exposure, or platform down — stop the line and roll back
        S2: orders misclassified, imports silently dropping rows, failures not routed — fix before the next import cycle
        S3: a view is wrong or degraded but the data is correct — next iteration
        S4: cosmetic — backlog
      release_blocking:
        - any open S1
        - any S2 affecting classification correctness, deduplication or the audit path
    evidence_requirements_for_certification:
