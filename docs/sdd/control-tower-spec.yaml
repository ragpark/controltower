        A wrong resolution cannot be undone from the interface. The audit record
        names every removed row and its snapshot is in order_history, so a
        manual reconstruction is possible but is not a tested procedure.
      scope: >-
        Applies to running the operation. Does not waive BLK-11 for any other
        purpose.
