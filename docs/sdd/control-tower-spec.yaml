      approver: null
    - id: EXC-03
      exception: Software delivered ahead of specification certification
      guardrail: no_production_code_before_certification
      rationale: This record is the retrofit; the exception is what it exists to make visible
      status: candidate_not_approved
      approver: null
    - id: EXC-04
      exception: No idempotency keys on state-changing POSTs
      guardrail: use_idempotency_keys_for_state_changing_posts
      rationale: >-
        Ingestion is idempotent by natural key instead. Operator actions
        (resolve, reassign) are not, and should adopt idempotency keys.
      status: candidate_not_approved
      approver: null

