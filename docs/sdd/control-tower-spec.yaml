  product_intent:
    problem_statement: >-
      Order lifecycle visibility was maintained by hand in an Excel dashboard.
      It was rebuilt manually, held classification logic in spreadsheet
      formulas known to one person, offered no history or audit, and could
      not join downstream provisioning failures to the orders they affected —
      so customer-impacting failures were found late and ownership of the
      next step was decided ad hoc.
    opportunity_statement: >-
      A single control tower that ingests order data from wherever it lives,
      classifies every order line against rules operations can change
      themselves, and surfaces what needs human action with a named owning
      team.
    vision: >-
      Every order line has a current, explainable state, and every
      customer-impacting exception has an owner and a next step.
    business_context:
      replaces: manual_excel_dashboard
      operating_model: internal_operations_team
      upstream_systems:
        - ActiveHub (order export)
        - downstream provisioning system (daily failure report by email)
      write_back: none
    goals:
      - { id: G-01, goal: Retire the manual Excel dashboard,                            measures: [SM-01] }
      - { id: G-02, goal: Make every classification explainable and auditable,          measures: [SM-04, SM-08] }
      - { id: G-03, goal: Let operations change classification rules without a release, measures: [SM-03] }
      - { id: G-04, goal: Ingest from any source the data actually lives in,            measures: [SM-05] }
      - { id: G-05, goal: Route customer-impacting failures to an owning team,          measures: [SM-02] }
      - { id: G-06, goal: Operate the platform safely and under access control,         measures: [SM-06, SM-07, SM-09] }
    non_goals:
      - order_placement_amendment_or_cancellation
      - write_back_to_activehub_gps_licence_manager_or_any_upstream_system
      - customer_or_partner_facing_access
      - learner_facing_functionality
      - billing_entitlement_or_licence_issuance
      - automated_remediation_of_provisioning_failures
      - ai_or_ml_inference_in_the_classification_path
      - multi_tenant_isolation
      - real_time_streaming_ingestion
      - native_mobile_applications
      - replacing_the_downstream_failure_email_at_source
    success_measures:
      - { id: SM-01, measure: Excel dashboard retired,                                     target: 'yes',                current: unconfirmed }
      - { id: SM-02, measure: Time from provisioning failure report to owner identified,    target: <= 1 working day,     current: not_instrumented }
      - { id: SM-03, measure: Share of orders auto-classified without human triage,         target: '>= 0.90',            current: not_instrumented }
      - { id: SM-04, measure: Share of orders landing on the priority-1000 catch-all rule,  target: <= 0.05,              current: not_instrumented }
      - { id: SM-05, measure: Import success rate (rows accepted / rows submitted),         target: '>= 0.99',            current: visible_per_run_not_aggregated }
      - { id: SM-06, measure: Automated test coverage of new code,                          target: '>= 0.80',            current: enforced_in_one_package_only }
      - { id: SM-07, measure: PII-in-logs incidents,                                        target: 0,                    current: no_scan_in_place }
      - { id: SM-08, measure: WCAG 2.2 AA critical or serious findings,                     target: 0,                    current: never_audited }
      - { id: SM-09, measure: Unauthenticated production access,                            target: 0,                    current: all_access_is_unauthenticated }
    assumptions:
      - { id: A-01, assumption: Order number plus product code uniquely identifies an order line across every source. Implemented as the deduplication natural key. }
      - { id: A-02, assumption: The daily provisioning failure email is a complete snapshot; absence of a previously reported failure means it is resolved. }
      - { id: A-03, assumption: Order numbers in the failure report join exactly to orders.order_number. }
      - { id: A-04, assumption: A single operating unit; no tenancy boundary is required. }
      - { id: A-05, assumption: Upstream export formats are stable enough that column mapping changes are occasional and can be made in Settings. }
    risks:
      - { id: R-01, risk: Public unauthenticated access to personal data,                    severity: critical, mitigation: ENG-701 }
      - { id: R-02, risk: Container-only build failures escape CI,                           severity: critical, mitigation: ENG-704, evidence: two_production_incidents }
      - { id: R-03, risk: A bad rule change reclassifies the whole estate on reapply,        severity: material, mitigation: rule preview exists; no approval step (OQ-08) }
      - { id: R-04, risk: Crash between import and classification leaves orders unclassified, severity: material, mitigation: ENG-802 transactional outbox }
      - { id: R-05, risk: Upstream export format drift breaks ingestion,                     severity: material, mitigation: configurable column mapping; RB-05 runbook required }
      - { id: R-06, risk: Rollback across a schema change is unsafe (no down migrations),    severity: critical, mitigation: ENG-709 }

  personas:
    - { id: P-01, role: Operations Analyst,             evidence_source: stated_by_requestor }
    - { id: P-02, role: Operations Manager,             evidence_source: stated_by_requestor }
