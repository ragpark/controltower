      - fix_defects_with_a_failing_regression_test_first
    forbidden_for_ai_coding_tools:
      - store_or_log_raw_pii
      - change_auth_enabled_flag_or_entra_configuration
      - change_the_rbac_role_hierarchy_or_endpoint_role_decorations
      - change_the_audit_write_path_or_land_a_decision_path_without_an_audit_write
      - change_the_deduplication_natural_key_order_number_product_code
      - change_published_event_names_or_payload_shapes
      - change_retention_backup_or_restore_configuration
      - write_a_migration_that_drops_or_renames_a_customer_data_column
      - modify_ci_cd_pipeline_files_or_deployment_configuration
      - modify_dockerfile_build_stages_without_proving_the_image_builds
      - commit_directly_to_main
      - self_approve_pull_requests
      - force_push_or_rewrite_history_on_a_shared_branch
      - send_order_or_customer_data_to_any_third_party_service_or_model
      - introduce_ai_or_ml_inference_into_the_classification_path
      - widen_exposure_or_add_multi_tenancy_until_blk_01_closes
    required_for_ai_coding_tools:
