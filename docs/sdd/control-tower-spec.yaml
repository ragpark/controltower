      - unit_and_component_test_results
      - api_integration_test_results
      - container_image_build_and_boot_evidence
      - coverage_report_meeting_the_floor
      - axe_ci_results
      - manual_wcag_2_2_aa_audit_report
      - assistive_technology_session_notes
      - load_test_results_against_the_p95_nfr
      - dependency_and_secret_scan_reports
      - threat_model_and_remediation_status
      - pii_in_logs_scan_results
      - backup_and_restore_test_evidence
      - retention_job_evidence
      - audit_coverage_sample
      - authentication_enforcement_evidence_from_a_deployed_environment
      - runbook_completion_status
    acceptance_recommendation:
      status: not_recommended_for_certification
      rationale: 16 open certification blockers, of which BLK-01 is live in production.

