# ---------------------------------------------------------------------------
# Agent manifest — authoritative for agentic AI coding tool behaviour.
# ---------------------------------------------------------------------------
agent_manifest:
  spec:
    id: AHCTL-02
    predecessor_id: OCT-001
    title: ActiveHub Control Tower
    version: 1.0.0-draft
    status: DRAFT_NOT_CERTIFIED
    human_review_required: true
    risk_acknowledgement:
      accepted_by: null
      role: null
      date: null

  platform:
    area: ActiveHub
    domain: activehub-control-tower
    reuse_before_creation: reconciled_via_supersession_of_oct_001
    pattern: 'Web -> API -> domain libraries -> PostgreSQL, with an in-process event bus'
    ai_in_product: false

  guardrails:
    permitted_for_ai_coding_tools:
      - add_or_extend_rule_strategies_behind_the_existing_registry
      - add_or_extend_source_connectors_behind_the_existing_registry
      - write_unit_contract_and_e2e_tests
      - refactor_within_a_single_workspace_package
      - author_documentation_adrs_and_runbooks
      - add_structured_logging_metrics_and_tracing_with_the_pii_rule_enforced
      - apply_accessibility_fixes_to_existing_mui_conformant_patterns
      - fix_defects_with_a_failing_regression_test_first
    forbidden_for_ai_coding_tools:
      - store_or_log_raw_pii
      - change_auth_enabled_flag_or_entra_configuration
      - change_the_rbac_role_hierarchy_or_endpoint_role_decorations
      - change_the_audit_write_path_or_land_a_decision_path_without_an_audit_write
      - change_the_deduplication_natural_key_order_number_product_code
      - change_published_event_names_or_payload_shapes
      - change_retention_backup_or_restore_configuration
      - write_a_migration_that_drops_or_renames_a_customer_data_column
      - modify_ci_cd_pipeline_files_or_deployment_configuration
      - modify_dockerfile_build_stages_without_proving_the_image_builds
      - commit_directly_to_main
      - self_approve_pull_requests
      - force_push_or_rewrite_history_on_a_shared_branch
      - send_order_or_customer_data_to_any_third_party_service_or_model
      - introduce_ai_or_ml_inference_into_the_classification_path
      - widen_exposure_or_add_multi_tenancy_until_blk_01_closes
    required_for_ai_coding_tools:
      - link_prs_to_spec_id_ahctl_02
      - link_prs_to_predecessor_spec_id_oct_001_where_the_codebase_still_references_it
      - link_prs_to_relevant_adrs
      - link_prs_to_task_id
      - include_unit_tests
      - include_contract_tests_when_api_or_event_surface_changed
      - include_accessibility_checks_for_ui_changes
      - pass_pii_in_logs_review
      - include_audit_write_for_state_changing_operator_actions
      - use_correlation_ids
      - use_structured_json_logging
      - keep_domain_logic_in_dependency_free_service_packages
      - ship_a_regression_test_with_every_defect_fix
      - state_whether_container_images_were_built
      - human_reviewer_approval
    human_sign_off_required_for:
      - authentication_and_authorisation_changes
      - audit_path_changes
      - event_contract_changes
      - deduplication_key_changes
      - retention_or_pii_handling_changes
      - database_migrations_affecting_customer_data
      - ci_cd_and_deployment_configuration_changes
      - hosting_platform_or_residency_affecting_changes
      - seeded_classification_rule_changes
      - introduction_of_any_ai_ml_component

  build_invariants:
    - { id: BI-01, invariant: 'apps/api/tsconfig.build.json keeps rootDir "src" and excludes prisma' }
    - { id: BI-02, invariant: 'Dockerfile `test -f` entrypoint guards retained' }
    - { id: BI-03, invariant: 'web Dockerfile copies and builds every workspace package imported' }

  nfrs:
    api_p95_ms: 500
    availability_target: 0.995
    coverage_floor_new_code: 0.80
    pii_in_logs_tolerance: 0
    audit_coverage_required: 1.0
    wcag: 2.2-AA
    security_baseline: OWASP_ASVS_L2
    unauthenticated_production_access_tolerance: 0

  review_and_warnings_summary:
    certification_blockers_open: 18
    critical_blockers_open: 15
    material_blockers_open: 3
    live_production_risks: [BLK-01]
    warnings: 8
    open_questions: 11   # 13 raised, 2 closed by reconciliation
    exception_candidates: 4
    unresolved_conflicts: 2
    readiness_for_certification: NOT_READY
    readiness_for_continued_internal_use: CONDITIONAL_ON_BLK_01
    readiness_for_wider_exposure: BLOCKED
    reconciliation_status: unilateral_awaiting_countersignature
