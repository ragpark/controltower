name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octower
          POSTGRES_PASSWORD: octower
          POSTGRES_DB: octower_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U octower"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://octower:octower@localhost:5432/octower_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build packages, API and web
        run: npm run build

      - name: Unit and component tests
        run: npm test

      - name: Apply migrations
        run: npm run prisma:migrate

      - name: API integration tests (e2e)
        run: npm run test:e2e -w @control-tower/api
